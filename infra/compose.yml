services:
  app:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - '3000:3000'
    environment:
      POSTGRES_HOST: db
      NODE_ENV: development
    depends_on:
      - db
  db:
    image: postgres:14.22-trixie
    env_file:
      - ../.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
