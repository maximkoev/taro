#Leave it for learning purpose.
name: 'Migration Test'

on:
  workflow_call:

jobs:
  migration_smoke_test:
    name: 'Run migration smoke test'
    runs-on: ubuntu-latest
    environment: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taro
          POSTGRES_PASSWORD: taro
          POSTGRES_DB: taro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taro -d taro_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_USER: taro
      POSTGRES_PASSWORD: taro
      POSTGRES_HOST: localhost
      POSTGRES_DB: taro_test
      LLM_PROVIDER: fake
      LLM_API_KEY: fake-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - run: npx prisma generate

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Seed database with old user test data
        run: npx prisma db seed

      - name: Apply backfill migration
        run: psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f prisma/migrations/20260604122258_backfill_user_first_last_name/migration.sql

      - name: Check user table columns
        run: npm run test:migration:schema
