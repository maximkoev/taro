name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v4

      - &node
        name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - &npm-install
        name: Install dependencies
        run: npm ci

      - &prisma-generate
        name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    environment: unit

    steps:
      - *checkout
      - *node
      - *npm-install
      - *prisma-generate

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    environment: unit

    steps:
      - *checkout
      - *node
      - *npm-install
      - *prisma-generate

      - name: Generate code coverage report
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *node
      - *npm-install

      - name: Build project
        run: npm run build
